[build-system]
requires = ["setuptools>=70.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geosignal"
version = "0.1.0"
description = "GeoSignal AI — Coverage gap detection and BTS placement recommendation for Indonesia's 3T regions."
requires-python = ">=3.11"
dependencies = [
    "xgboost==2.1.1",
    "lightgbm==4.4.0",
    "scikit-learn==1.5.2",
    "shap==0.46.0",
    "hypothesis==6.112.0",
    "geopandas==1.0.1",
    "numpy==1.26.4",
    "pandas==2.2.3",
    "supabase==2.9.0",
    "shapely==2.0.6",
    "pyproj==3.6.1",
    "rasterio==1.3.11",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-cov==5.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["geosignal*"]
